[package]
name = "rustpilot"
version = "0.1.0"
description = "Code editor desktop ringan ala JetBrains"
edition = "2024"

[lib]
# Sufiks `_lib` diperlukan di Windows agar nama lib tidak bentrok dengan bin
# (https://github.com/rust-lang/cargo/issues/8519).
name = "rustpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
