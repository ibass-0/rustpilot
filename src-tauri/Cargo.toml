[package]
name = "rustpilot"
version = "0.1.0"
description = "Lightweight JetBrains-style desktop code editor"
authors = ["Indra Basuki <indrbasuki1@gmail.com>"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name from clashing with the bin on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "rustpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.4"
portable-pty = "0.9.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"

# Build dependencies without debug info: keeps target/debug several GB smaller.
[profile.dev.package."*"]
debug = false
